[package]
name = "analiz-storage-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "blob", "backup"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
