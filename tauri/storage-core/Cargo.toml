[package]
name = "analiz-storage-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
fs2 = "0.4"
analiz-import-core = { path = "../import-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "blob", "backup", "hooks"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.10"

[dev-dependencies]
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
tempfile = "3"
