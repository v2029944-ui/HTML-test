[package]
name = "analiz-rabot-tauri"
version = "0.1.3"
description = "Анализ выполненных работ — Tauri и SQLite"
authors = ["HTML-test contributors"]
edition = "2021"
rust-version = "1.82"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fs2 = "0.4"
analiz-import-core = { path = "../import-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "blob", "backup", "hooks"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.10"

[dev-dependencies]
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
tempfile = "3"

