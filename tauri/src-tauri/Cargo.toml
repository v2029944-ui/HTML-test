[package]
name = "analiz-rabot-tauri"
version = "0.1.3"
description = "Анализ выполненных работ — Tauri и SQLite"
authors = ["HTML-test contributors"]
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

