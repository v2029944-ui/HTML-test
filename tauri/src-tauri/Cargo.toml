[package]
name = "analiz-rabot-tauri"
version = "1.12.10"
description = "Анализ выполненных работ — Tauri и SQLite"
authors = ["HTML-test contributors"]
edition = "2021"
rust-version = "1.82"
build = "build.rs"

[features]
ci-webview2 = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tempfile = "3"
fs2 = "0.4"
analiz-import-core = { path = "../import-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "blob", "backup", "hooks", "collation", "functions"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
# ICU 1.5 accepts newer UTF iterators that require Rust 1.83.
utf16_iter = "=1.0.5"
utf8_iter = "=1.0.4"
icu_collator = "1.5"
icu_provider = { version = "1.5", features = ["sync"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Storage_EnhancedStorage", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }

