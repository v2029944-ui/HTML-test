# Signed Tauri releases reuse the existing updater key for every new version.
# Default operation only checks keys. Publication requires explicit owner dispatch.
name: Tauri signed Windows release

on:
  # Verify existing secrets automatically when this workflow is first merged.
  # This event can never publish: the publish job requires workflow_dispatch inputs.
  push:
    branches: [main]
    paths: ['.github/workflows/tauri-signed-release.yml']
  workflow_dispatch:
    inputs:
      operation:
        description: "Check keys without publishing, or publish an approved new version"
        required: true
        type: choice
        default: check-keys
        options: [check-keys, sign-only, publish]
      version:
        description: "For publish: new version, e.g. 0.1.6"
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: tauri-signed-release
  cancel-in-progress: false

jobs:
  signing-ready:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.keys.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check existing secrets without exposing values
        id: keys
        shell: python
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          ANALIZ_UPDATER_PUBLIC_KEY: ${{ secrets.ANALIZ_UPDATER_PUBLIC_KEY }}
          OPERATION: ${{ inputs.operation }}
        run: |
          import os, sys
          required = ('TAURI_SIGNING_PRIVATE_KEY', 'ANALIZ_UPDATER_PUBLIC_KEY')
          missing = [k for k in required if not os.environ.get(k, '').strip()]
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf8') as out:
              out.write('configured=' + ('false' if missing else 'true') + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf8') as out:
              out.write('Missing: ' + ', '.join(missing) + '. No release published.\n'
                        if missing else 'Existing signing secrets present. No values disclosed.\n')
          if missing:
              sys.exit('Signing secrets are missing; no release published')
      - name: Confirm public key matches previous signed release 0.1.2
        if: steps.keys.outputs.configured == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ANALIZ_UPDATER_PUBLIC_KEY: ${{ secrets.ANALIZ_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mkdir -p historical
          gh release download tauri-v0.1.2 --repo "$GITHUB_REPOSITORY" \
            --pattern 'Analiz-rabot-Tauri-Windows-x64-setup.exe.sig' --dir historical
          node tauri/check-update-signing.cjs historical/Analiz-rabot-Tauri-Windows-x64-setup.exe.sig
          echo 'Public key identity matches signed 0.1.2.' >> "$GITHUB_STEP_SUMMARY"
      - name: Require new version, release notes and successful main Windows CI
        if: (inputs.operation == 'publish' || inputs.operation == 'sign-only') && steps.keys.outputs.configured == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Enter new version"; exit 1; }
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$GITHUB_SHA" == "$main_sha" ]] || { echo "::error::Main moved"; exit 1; }
          node - <<'NODE'
          const fs=require('node:fs'),v=process.env.EXPECTED_VERSION;
          const config=JSON.parse(fs.readFileSync('tauri/src-tauri/tauri.conf.json','utf8'));
          const pkg=JSON.parse(fs.readFileSync('tauri/package.json','utf8'));
          const cargo=fs.readFileSync('tauri/src-tauri/Cargo.toml','utf8').match(/^version\s*=\s*"([^"]+)"/m);
          if(v!==config.version||v!==pkg.version||v!==cargo?.[1])throw Error('Versions differ');
          require('./tauri/publish.cjs').releaseNotesFile(v);
          if(config.plugins.updater.endpoints[0]!=='https://github.com/v2029944-ui/HTML-test/releases/download/tauri-updates/tauri-latest.json')
            throw Error('Unexpected updater channel');
          NODE
          tag="tauri-v$EXPECTED_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
             gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::Existing version/tag cannot be reused"; exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&status=success&per_page=100" |
            jq -e '[.workflow_runs[] | select(.name == "Tauri 2 Windows (experimental)" and .event == "push" and .head_branch == "main" and .conclusion == "success")] | length > 0' >/dev/null ||
            { echo "::error::No successful Windows CI for this main commit"; exit 1; }
          echo "Approved $tag on verified commit $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  build-and-publish:
    needs: signing-ready
    if: (inputs.operation == 'publish' || inputs.operation == 'sign-only') && needs.signing-ready.outputs.configured == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'tauri/src-tauri -> target'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Tauri CLI
        shell: pwsh
        run: |
          npm install --prefix tauri --no-audit --no-fund --include=optional
          if ($LASTEXITCODE -ne 0) { throw 'Tauri CLI installation failed' }
          $cliVersion = (Get-Content 'tauri/node_modules/@tauri-apps/cli/package.json' -Raw | ConvertFrom-Json).version
          if (-not (Test-Path 'tauri/node_modules/@tauri-apps/cli-win32-x64-msvc/package.json')) {
            npm install --prefix tauri --no-save --no-package-lock --no-audit --no-fund "@tauri-apps/cli-win32-x64-msvc@$cliVersion"
            if ($LASTEXITCODE -ne 0) { throw 'Tauri Windows native CLI installation failed' }
          }
          node -e "require('./tauri/node_modules/@tauri-apps/cli')"
          if ($LASTEXITCODE -ne 0) { throw 'Tauri Windows native CLI verification failed' }
      - name: Test frontend, Rust, SQLite and recovery
        shell: pwsh
        run: |
          node --test tauri/tests/*.test.cjs tests/test_*.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Node tests failed' }
          npm --prefix tauri run prepare:frontend
          if ($LASTEXITCODE -ne 0) { throw 'Frontend preparation failed' }
          npm --prefix tauri run icons
          if ($LASTEXITCODE -ne 0) { throw 'Icon generation failed' }
          cargo test --manifest-path tauri/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'App Rust tests failed' }
          cargo test --locked --manifest-path tauri/import-core/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'XLSX tests failed' }
          cargo test --locked --manifest-path tauri/storage-core/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'SQLite tests failed' }
          python -m unittest discover -s tests -p test_sqlite_restore_copy.py -v
          if ($LASTEXITCODE -ne 0) { throw 'Recovery test failed' }
      - name: Sign release with the existing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANALIZ_UPDATER_PUBLIC_KEY: ${{ secrets.ANALIZ_UPDATER_PUBLIC_KEY }}
        run: npm --prefix tauri run build:signed:windows
      - name: Check signature key identity and preserve distributable installer
        shell: pwsh
        env:
          ANALIZ_UPDATER_PUBLIC_KEY: ${{ secrets.ANALIZ_UPDATER_PUBLIC_KEY }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $exe = "tauri/release/tauri-v$env:EXPECTED_VERSION/Analiz-rabot-Tauri-Windows-x64-setup.exe"
          if (!(Test-Path $exe) -or !(Test-Path "$exe.sig")) { throw 'Missing signed release files' }
          node tauri/check-update-signing.cjs "$exe.sig"
          if ($LASTEXITCODE -ne 0) { throw 'Signing key mismatch' }
          # Verify the actual installer bytes with the configured updater public key.
          @'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const exe = process.argv[2];
          const unpack = text => text.startsWith('untrusted comment:') ? text : Buffer.from(text, 'base64').toString('utf8');
          const publicText = process.env.ANALIZ_UPDATER_PUBLIC_KEY.trim();
          const raw = Buffer.from(publicText, 'base64');
          const key = raw.length === 42 ? raw : Buffer.from(unpack(publicText).trim().split(/\r?\n/)[1], 'base64');
          const sig = Buffer.from(unpack(fs.readFileSync(exe + '.sig', 'utf8').trim()).trim().split(/\r?\n/)[1], 'base64');
          const alg = sig.subarray(0, 2).toString();
          if (key.length !== 42 || sig.length !== 74 || !['ED','Ed'].includes(alg) || !key.subarray(2,10).equals(sig.subarray(2,10))) throw Error('Invalid updater signature');
          const bytes = fs.readFileSync(exe);
          const payload = alg === 'ED' ? crypto.createHash('blake2b512').update(bytes).digest() : bytes;
          const der = Buffer.concat([Buffer.from('302a300506032b6570032100','hex'),key.subarray(10)]);
          if (!crypto.verify(null,payload,{key:der,format:'der',type:'spki'},sig.subarray(10))) throw Error('Invalid installer signature');
          '@ | node - $exe
          if ($LASTEXITCODE -ne 0) { throw 'Signed installer verification failed' }
          New-Item -ItemType Directory -Force 'tauri/test-artifacts' | Out-Null
          Copy-Item $exe 'tauri/test-artifacts/setup.exe'
          Copy-Item "$exe.sig" 'tauri/test-artifacts/setup.exe.sig'
      - name: Build isolated non-distributable WebView2 test installer
        id: gui_smoke_build
        shell: pwsh
        run: |
          Push-Location tauri
          try {
            npx tauri build --config tests/ci-webview2.json --features ci-webview2
            if ($LASTEXITCODE -ne 0) { throw 'WebView2 test build failed' }
          } finally { Pop-Location }
      - name: Prepare installed GUI test dependencies
        id: gui_smoke_dependencies
        if: ${{ !cancelled() && steps.gui_smoke_build.outcome == 'success' }}
        env:
          PYTHONIOENCODING: utf-8
        shell: pwsh
        run: |
          python -m pip install playwright==1.62.0
          if ($LASTEXITCODE -ne 0) { throw 'Playwright install failed' }
      - name: Test installed GUI helpers
        if: ${{ !cancelled() && steps.gui_smoke_dependencies.outcome == 'success' }}
        env:
          PYTHONIOENCODING: utf-8
        shell: pwsh
        run: |
          python -m unittest discover -s tauri/tests -p 'test_reference_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Native GUI helper tests failed' }
      - name: Test two installed clients through a real temporary SMB share
        id: shared_gui_smoke
        if: ${{ !cancelled() && steps.gui_smoke_build.outcome == 'success' && steps.gui_smoke_dependencies.outcome == 'success' }}
        env:
          PYTHONIOENCODING: utf-8
        shell: pwsh
        run: |
          python tauri/tests/windows_shared_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Installed independent SMB clients failed' }
      - name: Retain installed shared-workspace diagnostics
        if: ${{ always() && steps.gui_smoke_build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Tauri-signed-shared-workspace-tests
          path: |
            tauri/test-artifacts/shared-smb-*.png
            tauri/test-artifacts/shared-smb-*.json
            tauri/test-artifacts/shared-smb-error.txt
            tauri/test-artifacts/native-file-dialogs-inventory-shared-smb-*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Test installed app through real WebView2
        if: ${{ !cancelled() && steps.gui_smoke_build.outcome == 'success' && steps.gui_smoke_dependencies.outcome == 'success' }}
        env:
          PYTHONIOENCODING: utf-8
          REFERENCE_HEAD_SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          python tauri/tests/windows_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Installed GUI test failed' }
      - name: Retain signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tauri-signed-Windows
          path: tauri/release/tauri-v*/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish signed GitHub Release and advance updater channel
        if: inputs.operation == 'publish'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $current = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $current.Trim() -ne $env:GITHUB_SHA) { throw 'Main moved; release aborted' }
          gh release view "tauri-v$env:EXPECTED_VERSION" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Existing release cannot be overwritten' }
          node tauri/publish.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed' }
