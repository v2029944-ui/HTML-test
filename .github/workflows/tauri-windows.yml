name: Tauri 2 Windows (experimental)

on:
  push:
    branches: [main, work/tauri-dropdown-updates-20261117]
  pull_request:
    paths:
      - "tauri/**"
      - "index.html"
      - "tests/**"
      - ".github/workflows/tauri-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

# Multiple pushes while reviewing a PR should not consume parallel Windows
# runners on obsolete commits. Main and manual release checks are not cancelled.
concurrency:
  group: tauri-windows-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-and-build:
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "tauri/src-tauri -> target"
          cache-on-failure: true
      - name: Install Tauri CLI
        shell: pwsh
        run: |
          npm install --prefix tauri --no-audit --no-fund --include=optional
          if ($LASTEXITCODE -ne 0) { throw 'Tauri CLI installation failed' }
          # npm occasionally omits the Windows native optional dependency.
          # Install the exact platform package matching the resolved CLI version.
          $cliVersion = (Get-Content 'tauri/node_modules/@tauri-apps/cli/package.json' -Raw | ConvertFrom-Json).version
          if (-not (Test-Path 'tauri/node_modules/@tauri-apps/cli-win32-x64-msvc/package.json')) {
            npm install --prefix tauri --no-save --no-package-lock --no-audit --no-fund "@tauri-apps/cli-win32-x64-msvc@$cliVersion"
            if ($LASTEXITCODE -ne 0) { throw 'Tauri Windows native CLI installation failed' }
          }
          node -e "require('./tauri/node_modules/@tauri-apps/cli')"
          if ($LASTEXITCODE -ne 0) { throw 'Tauri Windows native CLI verification failed' }
      - name: Check frontend bridge and prepare HTML
        shell: pwsh
        run: |
          node --test tauri/tests/*.test.cjs tests/test_*.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Node regression tests failed' }
          npm --prefix tauri run prepare:frontend
          if ($LASTEXITCODE -ne 0) { throw 'Frontend preparation failed' }
          npm --prefix tauri run icons
          if ($LASTEXITCODE -ne 0) { throw 'Tauri icon generation failed' }
      - name: Test SQLite migration and safe folder access
        run: cargo test --manifest-path tauri/src-tauri/Cargo.toml
      - name: Test streamed native XLSX import core
        run: cargo test --locked --manifest-path tauri/import-core/Cargo.toml
      - name: Test bounded SQLite read model
        run: cargo test --locked --manifest-path tauri/storage-core/Cargo.toml
      - name: Test independent clients through a disposable Windows SMB share
        shell: pwsh
        run: |
          $shareName = 'AnalizTest' + [guid]::NewGuid().ToString('N')
          $directory = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP $shareName)
          $account = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          New-SmbShare -Name $shareName -Path $directory.FullName -FullAccess $account -ErrorAction Stop | Out-Null
          try {
            $env:ANALIZ_TEST_SMB_PARENT = '\\localhost\' + $shareName
            cargo test --locked --manifest-path tauri/storage-core/Cargo.toml storage::shared_folder::tests
            if ($LASTEXITCODE -ne 0) { throw "Shared-folder tests failed" }
          } finally {
            Remove-SmbShare -Name $shareName -Force
            Remove-Item -LiteralPath $directory.FullName -Recurse -Force
          }

      - name: Build Windows installer
        if: github.ref != 'refs/heads/work/tauri-dropdown-updates-20261117'
        run: npm --prefix tauri run build:windows
      - name: Preserve unsigned CI installer before GUI test build
        if: github.ref != 'refs/heads/work/tauri-dropdown-updates-20261117'
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem "tauri/src-tauri/target/release/bundle/nsis/*.exe")
          if ($setups.Count -ne 1) { throw "Expected exactly one unsigned CI installer." }
          New-Item -ItemType Directory -Force "tauri/test-artifacts" | Out-Null
          Copy-Item $setups[0].FullName "tauri/test-artifacts/setup.exe"
      - name: Build signed preview without publishing a release
        if: github.ref == 'refs/heads/work/tauri-dropdown-updates-20261117'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANALIZ_UPDATER_PUBLIC_KEY: ${{ secrets.ANALIZ_UPDATER_PUBLIC_KEY }}
        run: npm --prefix tauri run build:signed:windows
      - name: Preserve signed preview before building test-only WebView2 bundle
        if: github.ref == 'refs/heads/work/tauri-dropdown-updates-20261117'
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem "tauri/src-tauri/target/release/bundle/nsis/*.exe")
          if ($setups.Count -ne 1) { throw "Expected exactly one signed preview installer." }
          New-Item -ItemType Directory -Force "tauri/test-artifacts" | Out-Null
          Copy-Item $setups[0].FullName "tauri/test-artifacts/setup.exe"
          Copy-Item ($setups[0].FullName + ".sig") "tauri/test-artifacts/setup.exe.sig"
      - name: Build non-distributable GUI test installer with WebView2 CDP
        id: gui_smoke_build
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work/tauri-dropdown-updates-20261117'
        shell: pwsh
        run: |
          Push-Location tauri
          try {
            npx tauri build --config tests/ci-webview2.json --features ci-webview2
            if ($LASTEXITCODE -ne 0) { throw 'WebView2 smoke build failed' }
          }
          finally { Pop-Location }
      - uses: actions/setup-python@v5
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work/tauri-dropdown-updates-20261117'
        with:
          python-version: '3.12'
      - name: Test SQLite recovery rehearsal on copies
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/work/tauri-dropdown-updates-20261117'
        run: python -m unittest discover -s tests -p test_sqlite_restore_copy.py -v
      - name: Prepare installed GUI test dependencies
        id: gui_smoke_dependencies
        if: ${{ !cancelled() && steps.gui_smoke_build.outcome == 'success' }}
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install playwright==1.62.0
          if ($LASTEXITCODE -ne 0) { throw 'Playwright installation failed' }
      - name: Test installed GUI helpers
        if: ${{ !cancelled() && steps.gui_smoke_dependencies.outcome == 'success' }}
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m unittest discover -s tauri/tests -p 'test_reference_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Native GUI helper tests failed' }
      - name: Test two installed clients through a real temporary SMB share
        id: shared_gui_smoke
        if: ${{ !cancelled() && steps.gui_smoke_build.outcome == 'success' && steps.gui_smoke_dependencies.outcome == 'success' }}
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tauri/tests/windows_shared_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Installed independent SMB clients failed' }
      - name: Upload early shared SMB failure diagnostics
        if: ${{ !cancelled() && steps.shared_gui_smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Tauri-Windows-shared-SMB-failure
          path: |
            tauri/test-artifacts/shared-smb-proof.json
            tauri/test-artifacts/shared-smb-error.txt
            tauri/test-artifacts/shared-smb-*.png
            tauri/test-artifacts/native-file-dialogs-inventory-shared-smb-*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Run installed Windows application with real WebView2
        if: ${{ !cancelled() && steps.gui_smoke_build.outcome == 'success' && steps.gui_smoke_dependencies.outcome == 'success' }}
        env:
          PYTHONIOENCODING: utf-8
          ANALIZ_SMOKE_UNSIGNED_CI: ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && 'true' || 'false' }}
        run: |
          $env:REFERENCE_HEAD_SHA = "${{ github.event.pull_request.head.sha || github.sha }}"
          python tauri/tests/windows_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'WebView2 smoke test failed' }
      - name: Upload preview EXE and Windows verification
        if: always() && github.ref == 'refs/heads/work/tauri-dropdown-updates-20261117'
        uses: actions/upload-artifact@v4
        with:
          name: Tauri-Windows-preview
          path: tauri/test-artifacts/*
          if-no-files-found: warn
          retention-days: 14
      - name: Upload experimental installer
        if: github.ref != 'refs/heads/work/tauri-dropdown-updates-20261117'
        uses: actions/upload-artifact@v4
        with:
          name: Tauri-Windows-experimental
          # Preserve the original unsigned bundle; never upload the CDP-enabled GUI build.
          path: tauri/test-artifacts/setup.exe
          if-no-files-found: error
          retention-days: 14
      - name: Upload isolated Windows GUI smoke diagnostics
        if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: Tauri-Windows-WebView2-smoke
          path: |
            tauri/test-artifacts/build-info.json
            tauri/test-artifacts/windows-error.txt
            tauri/test-artifacts/windows-runtime.txt
            tauri/test-artifacts/windows-webview2.png
            tauri/test-artifacts/windows-desktop-diagnostic.png
            tauri/test-artifacts/windows-sql-*.png
            tauri/test-artifacts/reference-*.png
            tauri/test-artifacts/reference-*.json
            tauri/test-artifacts/native-file-*.png
            tauri/test-artifacts/native-file-dialogs*.json
            tauri/test-artifacts/shared-smb-*.png
            tauri/test-artifacts/shared-smb-*.json
            tauri/test-artifacts/shared-smb-error.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Upload installed interface gallery
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Analiz-rabot-screens
          path: tauri/test-artifacts/reference-screens.html
          if-no-files-found: error
          retention-days: 14
