# Owner-approved current Tauri 0.1.5 for manual Windows installation.
# Publish only when full Windows CI passes on the exact merged main commit.
# This DOES NOT sign the installer or change the tauri-updates channel.
name: Publish current Tauri 0.1.5 Windows release

on:
  workflow_run:
    workflows: ["Tauri 2 Windows (experimental)"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: tauri-v0.1.5-current-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CI_SHA: ${{ github.event.workflow_run.head_sha }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
      RELEASE_TAG: tauri-v0.1.5
      RELEASE_ASSET: Analiz-rabot-0.1.5-Windows-x64-setup.exe
      EXPECTED_BRANCH: release/tauri-0.1.5-current-20261118
    steps:
      - name: Validate exact main SHA, approved merged release PR and unique version
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [[ "$CI_SHA" == "$main_sha" ]] || { echo "::error::Verified SHA differs from current main"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/pulls?state=closed&per_page=100" |
            jq -e --arg sha "$CI_SHA" --arg branch "$EXPECTED_BRANCH" \
              '[.[] | select(.merge_commit_sha == $sha and .head.ref == $branch and .base.ref == "main" and .merged_at != null)] | length == 1' >/dev/null
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Existing 0.1.5 release must never be overwritten"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Existing 0.1.5 tag must never be reused"
            exit 1
          fi
          echo "Authorized exact merge commit: $CI_SHA"
      - name: Checkout verified main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Validate versions, release notes, and unchanged updater channel
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, re
          root=pathlib.Path('tauri')
          conf=json.loads((root/'src-tauri/tauri.conf.json').read_text(encoding='utf-8'))
          pkg=json.loads((root/'package.json').read_text(encoding='utf-8'))
          cargo=(root/'src-tauri/Cargo.toml').read_text(encoding='utf-8')
          match=re.search(r'^version\s*=\s*"([^"]+)"', cargo, re.M)
          assert match and match.group(1)==conf['version']==pkg['version']=='0.1.5'
          assert conf['plugins']['updater']['endpoints']==['https://github.com/v2029944-ui/HTML-test/releases/download/tauri-updates/tauri-latest.json']
          assert not conf['plugins']['updater']['pubkey'], 'Unexpected signed updater configuration'
          notes=(root/'release-notes/0.1.5.md').read_text(encoding='utf-8')
          assert len(notes)>1800 and '## Что добавлено' in notes and '## Обновление и ограничения' in notes
          assert 'не подписан' in notes and 'tauri-updates' in notes
          PY
      - name: Download installer built by verified Windows workflow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name Tauri-Windows-experimental --dir package
          test -f package/setup.exe
          test "$(stat -c %s package/setup.exe)" -gt 1000000
          mv package/setup.exe "package/$RELEASE_ASSET"
          (cd package && sha256sum "$RELEASE_ASSET" > SHA256SUMS.txt)
      - name: Publish current version with installer and exact changelog
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "package/$RELEASE_ASSET" "package/SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" --target "$CI_SHA" \
            --title "Анализ работ 0.1.5 — актуальная версия Windows x64 (ручная установка)" \
            --notes-file tauri/release-notes/0.1.5.md \
            --latest
      - name: Verify published Latest release, installer and checksum
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')" == "$RELEASE_TAG" ]]
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,assets --jq \
            '.isDraft == false and .isPrerelease == false and ([.assets[].name] | sort == (["Analiz-rabot-0.1.5-Windows-x64-setup.exe","SHA256SUMS.txt"] | sort))' |
            grep -qx true
          mkdir -p verified
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$RELEASE_ASSET" --dir verified
          cmp "package/$RELEASE_ASSET" "verified/$RELEASE_ASSET"
          (cd verified && sha256sum "../package/$RELEASE_ASSET" | \
            sed 's@../package/@@' | sha256sum --check --status)
          echo "Current release verified: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
