name: PR safety

on:
  pull_request:

permissions:
  contents: read

jobs:
  check-sensitive-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test file safety guard
        run: node --test .github/scripts/pr-safety.test.cjs
      - name: Check changed PR files
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/pr-safety.cjs
