# One-time owner-approved publication of signed Windows 1.5.1.
# Triggered only by the merged release PR and successful Windows CI at that exact main SHA.
name: Publish signed Tauri 1.5.1 after green Windows CI

on:
  workflow_run:
    workflows: ["Tauri 2 Windows (experimental)"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: tauri-signed-v1.5.1-one-shot
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    env:
      GH_TOKEN: ${{ github.token }}
      CI_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_TAG: tauri-v1.5.1
      EXPECTED_BRANCH: release/tauri-v1.5.1-signed-20261119
    steps:
      - name: Require exact main CI SHA, owner-approved merge and a new tag
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          echo 'ready=false' >> "$GITHUB_OUTPUT"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$main_sha" != "$CI_SHA" ]]; then
            echo 'An older main run completed. Not publishing.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'The unique version already exists. No overwrite.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo '::error::Release tag exists without matching GitHub Release.'
            exit 1
          fi
          if ! gh api "repos/$GITHUB_REPOSITORY/pulls?state=closed&per_page=100" |
            jq -e --arg sha "$CI_SHA" --arg branch "$EXPECTED_BRANCH" \
              '[.[] | select(.merge_commit_sha == $sha and .head.ref == $branch and .base.ref == "main" and .merged_at != null)] | length == 1' > /dev/null; then
            echo 'This SHA is not the authorized merged 1.5.1 release PR. Not publishing.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Validate version, changelog and update channel without secrets
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),v='1.5.1';
          const pkg=JSON.parse(fs.readFileSync('tauri/package.json','utf8'));
          const cfg=JSON.parse(fs.readFileSync('tauri/src-tauri/tauri.conf.json','utf8'));
          const cargo=fs.readFileSync('tauri/src-tauri/Cargo.toml','utf8').match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          if(v!==pkg.version||v!==cfg.version||v!==cargo)throw Error('Incorrect release version');
          if(cfg.plugins.updater.endpoints[0]!=='https://github.com/v2029944-ui/HTML-test/releases/download/tauri-updates/tauri-latest.json')throw Error('Unexpected update channel');
          if(cfg.plugins.updater.pubkey)throw Error('Signing key must not be committed to config');
          require('./tauri/publish.cjs').releaseNotesFile(v);
          NODE

  publish:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: windows-latest
    timeout-minutes: 100
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      CI_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'tauri/src-tauri -> target'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate key reuse against existing signed version 0.1.2
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          ANALIZ_UPDATER_PUBLIC_KEY: ${{ secrets.ANALIZ_UPDATER_PUBLIC_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY -or -not $env:ANALIZ_UPDATER_PUBLIC_KEY) {
            throw 'Existing signing secrets unavailable. Nothing was published.'
          }
          New-Item -ItemType Directory -Force historical | Out-Null
          gh release download tauri-v0.1.2 --repo "$env:GITHUB_REPOSITORY" --pattern 'Analiz-rabot-Tauri-Windows-x64-setup.exe.sig' --dir historical
          if ($LASTEXITCODE -ne 0) { throw 'Cannot retrieve historical signed release' }
          node tauri/check-update-signing.cjs historical/Analiz-rabot-Tauri-Windows-x64-setup.exe.sig
          if ($LASTEXITCODE -ne 0) { throw 'Updater key differs from already published 0.1.2' }
      - name: Install Tauri Windows CLI
        shell: pwsh
        run: |
          npm install --prefix tauri --no-audit --no-fund --include=optional
          if ($LASTEXITCODE -ne 0) { throw 'Tauri CLI install failed' }
          $cliVersion = (Get-Content 'tauri/node_modules/@tauri-apps/cli/package.json' -Raw | ConvertFrom-Json).version
          if (-not (Test-Path 'tauri/node_modules/@tauri-apps/cli-win32-x64-msvc/package.json')) {
            npm install --prefix tauri --no-save --no-package-lock --no-audit --no-fund "@tauri-apps/cli-win32-x64-msvc@$cliVersion"
            if ($LASTEXITCODE -ne 0) { throw 'Native Windows CLI install failed' }
          }
          node -e "require('./tauri/node_modules/@tauri-apps/cli')"
          if ($LASTEXITCODE -ne 0) { throw 'Tauri Windows CLI unavailable' }
      - name: Verify Node, Rust, native import, SQLite and recovery
        shell: pwsh
        run: |
          node --test tauri/tests/*.test.cjs tests/test_*.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Node tests failed' }
          npm --prefix tauri run prepare:frontend
          if ($LASTEXITCODE -ne 0) { throw 'Frontend preparation failed' }
          npm --prefix tauri run icons
          if ($LASTEXITCODE -ne 0) { throw 'Icon generation failed' }
          cargo test --manifest-path tauri/src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'App Rust tests failed' }
          cargo test --locked --manifest-path tauri/import-core/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Import Rust tests failed' }
          cargo test --locked --manifest-path tauri/storage-core/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'SQLite core tests failed' }
          python -m unittest discover -s tests -p test_sqlite_restore_copy.py -v
          if ($LASTEXITCODE -ne 0) { throw 'SQLite recovery tests failed' }
      - name: Build actual signed NSIS with existing release key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANALIZ_UPDATER_PUBLIC_KEY: ${{ secrets.ANALIZ_UPDATER_PUBLIC_KEY }}
        run: |
          npm --prefix tauri run build:signed:windows
          if ($LASTEXITCODE -ne 0) { throw 'Signed NSIS build failed; nothing was published' }
      - name: Preserve and verify signed release artifacts
        shell: pwsh
        env:
          ANALIZ_UPDATER_PUBLIC_KEY: ${{ secrets.ANALIZ_UPDATER_PUBLIC_KEY }}
        run: |
          $exe = 'tauri/release/tauri-v1.5.1/Analiz-rabot-Tauri-Windows-x64-setup.exe'
          if (!(Test-Path $exe) -or !(Test-Path "$exe.sig")) { throw 'Missing signed NSIS release' }
          node tauri/check-update-signing.cjs "$exe.sig"
          if ($LASTEXITCODE -ne 0) { throw 'Signature key does not match configured public key' }
          New-Item -ItemType Directory -Force 'tauri/test-artifacts' | Out-Null
          Copy-Item $exe 'tauri/test-artifacts/setup.exe'
          Copy-Item "$exe.sig" 'tauri/test-artifacts/setup.exe.sig'
      - name: Build isolated WebView2 diagnostics (never distributed)
        shell: pwsh
        run: |
          Push-Location tauri
          try {
            npx tauri build --config tests/ci-webview2.json
            if ($LASTEXITCODE -ne 0) { throw 'WebView2 diagnostics build failed' }
          } finally { Pop-Location }
      - name: Test actual installed Windows app via WebView2
        shell: pwsh
        run: |
          python -m pip install playwright==1.62.0
          if ($LASTEXITCODE -ne 0) { throw 'Playwright installation failed' }
          python tauri/tests/windows_smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'Installed GUI verification failed' }
      - name: Save signed versioned artifacts (without CDP test bundle)
        uses: actions/upload-artifact@v4
        with:
          name: Tauri-1.5.1-signed-Windows
          path: tauri/release/tauri-v1.5.1/*
          if-no-files-found: error
          retention-days: 14
      - name: Publish approved 1.5.1 and then advance signed updater channel
        shell: pwsh
        env:
          ANALIZ_RELEASE_CHANNEL: stable
        run: |
          $mainSha = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $mainSha.Trim() -ne $env:CI_SHA) { throw 'Main changed since verified CI' }
          gh release view tauri-v1.5.1 --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Version already published; do not overwrite' }
          node tauri/publish.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Release or channel publication failed' }
      - name: Confirm stable GitHub Release and identical updater signature
        shell: pwsh
        run: |
          $release = gh release view tauri-v1.5.1 --repo "$env:GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $release.isDraft -or $release.isPrerelease) { throw 'Stable version release not found' }
          $names = @($release.assets | ForEach-Object { $_.name })
          if (-not ($names -contains 'Analiz-rabot-Tauri-Windows-x64-setup.exe') -or -not ($names -contains 'Analiz-rabot-Tauri-Windows-x64-setup.exe.sig')) {
            throw 'Public release is missing signed installer or .sig'
          }
          New-Item -ItemType Directory -Force published | Out-Null
          gh release download tauri-updates --repo "$env:GITHUB_REPOSITORY" --pattern tauri-latest.json --dir published
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify public updater channel' }
          $manifest = Get-Content 'published/tauri-latest.json' -Raw | ConvertFrom-Json
          $signature = (Get-Content 'tauri/release/tauri-v1.5.1/Analiz-rabot-Tauri-Windows-x64-setup.exe.sig' -Raw).Trim()
          if ($manifest.version -ne '1.5.1' -or $manifest.platforms.'windows-x86_64'.signature.Trim() -ne $signature) {
            throw 'Updater channel points to another version/signature'
          }
          if (-not $manifest.notes.Contains('SQL')) { throw 'Update manifest is missing real release notes' }
          "Signed stable 1.5.1 published and channel verified: https://github.com/$env:GITHUB_REPOSITORY/releases/tag/tauri-v1.5.1" >> $env:GITHUB_STEP_SUMMARY
